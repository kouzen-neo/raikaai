name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security problems? Please report them privately (see SECURITY.md), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About
      placeholder: 0.1.30
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: e.g. Pixel 8, Android 15
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat
        - On-device model (LiteRT)
        - Remote provider
        - Agent / tools / MCP
        - Terminal / Linux environment
        - Characters / roleplay
        - Local API server
        - Settings / other
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Sidebar → Logs can be copied here. Remove API keys and personal data first.
