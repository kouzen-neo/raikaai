name: Supabase Keep-Alive

on:
  schedule:
    # Run every 3 days at 06:00 UTC to prevent Supabase free tier inactivity pause
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    steps:
      - name: Ping Characters API
        run: |
          curl -f -s -o /dev/null -w "HTTP %{http_code}\n" \
            "https://escnbqfpnwlnmdqhnzgu.supabase.co/rest/v1/categories?select=id&limit=1" \
            -H "apikey: sb_publishable_Na0C_KE0_8dS7g-ftCxwcA_Hj5F65in"
